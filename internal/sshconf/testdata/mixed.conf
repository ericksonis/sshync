# leading comment
Compression yes

Host alpha
    HostName alpha.example.com
	User eis
    IdentityFile ~/.ssh/a.pub
    ForwardAgent yes
	

Host beta beta-alias
	Hostname=beta.example.com
	#HostName old.example.com
	Port 2022  
    LocalForward 3400 one.example.com:3389
    LocalForward 3401 two.example.com:3389
    
Host "quoted name"
  IdentityFile "C:/Program Files/key.pub"

Match host *.example.com exec "true"
  User matcher

Host *
    ServerAliveInterval 30
